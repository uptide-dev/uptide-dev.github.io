/* The landing page's tokens (site/index.html). */
:root{color-scheme:light;--bg:#F4F2EC;--surface:#FAF9F5;--line:#D5D2C8;--text:#22211E;--body:#57554F;--dim:#6A675F;--accent:#1D63C4;
  --logo-wave:#7CC4FF;--logo-line:#3E7FD9;
  --display:'Space Grotesk',system-ui,sans-serif;--sans:'Instrument Sans',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--gx:40px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#131210;--surface:#1B1A17;--line:#36342F;--text:#F0EEE7;--body:#BCB9AF;--dim:#918E83;--accent:#7CC4FF}}
:root[data-theme=dark]{color-scheme:dark;--bg:#131210;--surface:#1B1A17;--line:#36342F;--text:#F0EEE7;--body:#BCB9AF;--dim:#918E83;--accent:#7CC4FF}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dots{background-image:radial-gradient(color-mix(in srgb,var(--dim) 24%,transparent) .7px,transparent .7px);background-size:18px 18px}
.bar{border-bottom:1px solid var(--line)}
.bar-inner,main{max-width:1200px;width:100%;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.bar-inner{height:64px;padding:0 var(--gx);display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;font:600 24px var(--display);letter-spacing:-.04em}
.brand svg{width:30px;height:30px;flex-shrink:0}
.brand .wave{stroke:var(--logo-wave)} .brand .base{stroke:var(--logo-line)}
main{flex:1;padding:120px var(--gx);display:flex;flex-direction:column;align-items:flex-start;gap:32px}
h1{margin:0;font:600 clamp(40px,6vw,72px)/1.05 var(--display);letter-spacing:-.045em;color:var(--text);text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);color:var(--text);background:var(--surface);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.solid{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--bg)}
@media (max-width:900px){:root{--gx:20px}.bar-inner,main{border-left:0;border-right:0}main{padding-top:72px}}
</style>
</head>

    <a class="btn" href="/docs/">Docs</a>
  </nav>
</main>

</body>
