name: Pages

# Publishes the landing page (site/, as it is) at / and the docs (docs-site/, built with
# Starlight from uptide-dev/uptide's docs/ folder) at /docs. The docs live in the other
# repository, so the site is rebuilt on every push to main here, once a day to pick up docs
# changes there, and by hand. See README.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # checkout reads the repository; deploy-pages publishes with the OIDC identity.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # The page's own address, for its canonical and social-preview URLs. The one value to
      # change when the page moves to a domain.
      SITE_URL: https://uptide-dev.github.io/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: docs-site/.node-version
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build the docs from uptide-dev/uptide@main
        working-directory: docs-site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
      - name: Put the landing page and the docs together
        run: node scripts/assemble-site.mjs _site
      - name: Write the site URL into the page
        run: |
          sed -i "s#%SITE_URL%#${SITE_URL}#g" _site/index.html
          if grep -q '%SITE_URL%' _site/index.html; then
            echo "::error::_site/index.html still has a %SITE_URL% placeholder."
            exit 1
          fi
      - name: No broken internal links
        run: node scripts/check-links.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
